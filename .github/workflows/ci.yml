name: ci

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && matrix.python-version == '3.12')) && fromJSON('["self-hosted","uwplasma-cpu"]') || 'ubuntu-latest' }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    env:
      JAX_PLATFORM_NAME: cpu
      JAX_ENABLE_X64: "1"
      NEO_JAX_FETCH_EXTERNAL_FIXTURES: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: false
      - name: Install package and test dependencies
        run: |
          uv venv
          uv pip install ".[dev]" pytest-xdist
      - name: Install VMEX integration dependencies
        if: matrix.python-version != '3.10'
        run: |
          uv pip install "vmex>=0.11.6"
      - name: Run tests
        run: .venv/bin/python -m pytest -n 3 -q
      - name: Smoke test installed CLI
        run: |
          SMOKE_DIR="$RUNNER_TEMP/neo_jax_cli_smoke"
          mkdir -p "$SMOKE_DIR"
          cp tests/fixtures/orbits/boozmn_ORBITS_FAST.nc "$SMOKE_DIR/boozmn_ORBITS_SMOKE.nc"
          cat > "$SMOKE_DIR/neo_in.ORBITS_SMOKE" <<'EOF'
          ! NEO control file (auto-generated)
          ! line2
          ! line3
          boozmn
          neo_out.ORBITS_SMOKE
          1
          96
          2
          2
          0
          0
          2
          1
          0.05
          4
          2
          4
          6
          0
          1
          0
          0
          2
          0
          0
          0
          0
          0
          0
          0
          0
          0
          neo_cur.ORBITS_SMOKE
          200
          2
          0
          EOF
          cd "$SMOKE_DIR"
          "$GITHUB_WORKSPACE/.venv/bin/neo-jax" ORBITS_SMOKE --quiet
          test -f neo_out.ORBITS_SMOKE

  smoke:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Smoke (hosted)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JAX_PLATFORM_NAME: cpu
      JAX_ENABLE_X64: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
      - name: Lint
        run: ruff check neo_jax --select E9,F63,F7,F82
      - name: Fast unit tests
        run: pytest -q tests/unit/test_control.py tests/unit/test_splines.py tests/unit/test_results_converter.py

  docs:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and docs dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[docs]"
      - name: Build docs
        run: python -m sphinx -W -b html docs docs/_build/html
