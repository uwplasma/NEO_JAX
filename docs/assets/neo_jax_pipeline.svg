<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">NEO_JAX geometry inputs and pipelines</title>
  <desc id="desc">Two paths into NEO_JAX: file-based boozmn input and in-memory VMEC to Boozer to NEO workflow.</desc>
  <rect width="1200" height="340" fill="#f7f6f3"/>
  <text x="600" y="42" text-anchor="middle" font-family="Arial, sans-serif" font-size="28" font-weight="700" fill="#22303a">Geometry paths into NEO_JAX</text>
  <g font-family="Arial, sans-serif" font-size="22" fill="#ffffff">
    <rect x="60" y="90" width="210" height="180" rx="18" fill="#0f766e"/>
    <text x="165" y="136" text-anchor="middle" font-weight="700">File-based path</text>
    <text x="165" y="172" text-anchor="middle">boozmn_*.nc</text>
    <text x="165" y="204" text-anchor="middle">read_boozmn</text>
    <text x="165" y="236" text-anchor="middle">BoozerData</text>

    <rect x="360" y="90" width="220" height="180" rx="18" fill="#0f4c81"/>
    <text x="470" y="136" text-anchor="middle" font-weight="700">In-memory path</text>
    <text x="470" y="172" text-anchor="middle">vmec_jax</text>
    <text x="470" y="204" text-anchor="middle">booz_xform_jax</text>
    <text x="470" y="236" text-anchor="middle">Boozer mapping</text>

    <rect x="680" y="90" width="220" height="180" rx="18" fill="#8b5e34"/>
    <text x="790" y="136" text-anchor="middle" font-weight="700">NEO_JAX core</text>
    <text x="790" y="172" text-anchor="middle">surface setup</text>
    <text x="790" y="204" text-anchor="middle">splines + RK4</text>
    <text x="790" y="236" text-anchor="middle">JAX / Python backend</text>

    <rect x="970" y="90" width="170" height="180" rx="18" fill="#7c3f58"/>
    <text x="1055" y="136" text-anchor="middle" font-weight="700">Outputs</text>
    <text x="1055" y="172" text-anchor="middle">eps_eff</text>
    <text x="1055" y="204" text-anchor="middle">diagnostics</text>
    <text x="1055" y="236" text-anchor="middle">plots / AD</text>
  </g>
  <g stroke="#22303a" stroke-width="8" fill="none" stroke-linecap="round">
    <path d="M270 180 H330"/>
    <path d="M580 180 H650"/>
    <path d="M900 180 H960"/>
  </g>
</svg>
