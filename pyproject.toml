[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neo-jax"
version = "1.0.2"
description = "Neoclassical transport code for effective ripple and trapped-particle diagnostics in Boozer coordinates"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["stellarator", "neoclassical transport", "effective ripple", "boozmn", "jax", "plasma physics"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Physics",
]

# Dependencies are minimal at this stage; GPU support is handled by the user's JAX install.
dependencies = [
  "jax",
  "jaxlib",
  "numpy",
  "netCDF4",
  "scipy",
]

[project.urls]
Homepage = "https://github.com/uwplasma/NEO_JAX"
Documentation = "https://github.com/uwplasma/NEO_JAX/tree/main/docs"
Repository = "https://github.com/uwplasma/NEO_JAX"
Issues = "https://github.com/uwplasma/NEO_JAX/issues"

[project.scripts]
neo-jax = "neo_jax.cli:main"
xneo = "neo_jax.cli:main"
xneo_jax = "neo_jax.cli:main"

[project.optional-dependencies]
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "black",
  "mypy",
]
docs = [
  "sphinx",
  "furo",
  "sphinxcontrib-bibtex",
  "sphinx-copybutton",
  "sphinx-design",
]

[tool.setuptools]
packages = ["neo_jax"]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
