[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neo-jax"
version = "1.0.0"
description = "Neoclassical transport code for effective ripple and trapped-particle diagnostics in Boozer coordinates"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["stellarator", "neoclassical transport", "effective ripple", "boozmn", "jax", "plasma physics"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Physics",
]

# Dependencies are minimal at this stage; GPU support is handled by the user's JAX install.
dependencies = [
  "jax>=0.4.28",
  "jaxlib>=0.4.28",
  "numpy>=1.24",
  "netCDF4>=1.6",
  "scipy>=1.10",
]

[project.urls]
Homepage = "https://github.com/uwplasma/NEO_JAX"
Documentation = "https://github.com/uwplasma/NEO_JAX/tree/main/docs"
Repository = "https://github.com/uwplasma/NEO_JAX"
Issues = "https://github.com/uwplasma/NEO_JAX/issues"

[project.scripts]
neo-jax = "neo_jax.cli:main"
xneo = "neo_jax.cli:main"
xneo_jax = "neo_jax.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=7",
  "pytest-cov>=4",
  "ruff>=0.4",
  "black>=24",
  "mypy>=1.8",
]
docs = [
  "sphinx>=7",
  "furo>=2024.1",
  "sphinxcontrib-bibtex>=2.6",
  "sphinx-copybutton>=0.5",
  "sphinx-design>=0.6",
]

[tool.setuptools]
packages = ["neo_jax"]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
